<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        font: 13px system-ui;
        width: 260px;
        padding: 10px;
      }
      button {
        width: 100%;
        margin: 4px 0;
        padding: 6px;
      }
      input {
        width: 100%;
        margin: 4px 0;
        padding: 4px;
        box-sizing: border-box;
      }
      #status {
        font-size: 12px;
        color: #555;
        margin-top: 8px;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <input id="label" type="text" placeholder="Lesson label (e.g. module-3-lesson-2)" />
    <button id="start">Start Capture</button>
    <button id="stop">Stop Capture</button>
    <button id="export">Export Text</button>
    <button id="clear">Clear Session</button>
    <div id="status">idle</div>
    <script src="popup.js"></script>
  </body>
</html>
